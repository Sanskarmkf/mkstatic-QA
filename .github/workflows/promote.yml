name: Promote to Final Repo v2
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to promote"
        required: true
        default: "main"
      target_branch_name:
        description: "Target branch in final repo (optional)"
        required: false
        default: "no-name"
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.source_branch }}

      - name: Checkout Sanskar-MKFoundation
        uses: actions/checkout@v3
        with:
          repository: Sanskarmkf/Sanskar-MKFoundation
          token: ${{ secrets.FINAL_REPOSITORY_TOKEN }}
          path: Sanskar-MKFoundation

      - name: Setup Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Force change
        run: |
          echo "Run ${{ github.run_id }}" >> Sanskar-MKFoundation/auto-log.txt

      - name: Detect default branch
        id: detect
        run: |
          cd Sanskar-MKFoundation
          DEFAULT=$(git remote show origin | grep "HEAD branch" | awk '{print $NF}')
          echo "branch=$DEFAULT" >> $GITHUB_OUTPUT

      - name: Determine PR branch name
        id: branch_name
        run: |
          if [ "${{ github.event.inputs.target_branch_name }}" = "no-name" ]; then
            echo "branch=no-name-${{ github.run_id }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.event.inputs.target_branch_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create PR in final repo
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.FINAL_REPOSITORY_TOKEN }}
          path: Sanskar-MKFoundation
          branch: ${{ steps.branch_name.outputs.branch }}
          base: ${{ steps.detect.outputs.branch }}
          add-paths: |
            .
          commit-message: "Auto update from ${{ github.event.inputs.source_branch }}"
          title: "Auto PR from ${{ github.event.inputs.source_branch }}"
          body: "Created manually via button"

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "New PR Created"
          body: |
            A new PR has been created.
            Source Branch: ${{ github.event.inputs.source_branch }}
            PR Branch: ${{ steps.branch_name.outputs.branch }}
            View PR:
            ${{ steps.create_pr.outputs.pull-request-url }}
          to: shubhamkokila123@gmail.com,madhavchy84@gmail.com,kumaramitthakur563@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}